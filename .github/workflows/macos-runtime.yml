name: macOS runtime validation

on:
  workflow_dispatch:
  push:
    branches: [main, codex/macos-runtime-validation]
    paths:
      - 'CrossPlatform/**'
      - 'PerfTicker/**'
      - 'remote/**'
      - 'tests/**'
      - 'tools/package_desktop.py'
      - 'tools/verify_macos.py'
      - '.github/workflows/macos-runtime.yml'
  pull_request:
    paths:
      - 'CrossPlatform/**'
      - 'PerfTicker/**'
      - 'remote/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/macos-runtime.yml'

permissions:
  contents: read

jobs:
  macos:
    name: Runtime (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixture regression checks
        run: |
          dotnet run --project tests/PerfTicker.Desktop.Tests -c Release
          python -m unittest discover -s tests -p 'test_collector.py'
      - name: Publish self-contained macOS app
        run: dotnet publish CrossPlatform/PerfTicker.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/publish
      - name: Package and sign
        run: python tools/package_desktop.py --rid ${{ matrix.rid }} --input artifacts/publish
      - name: Install isolated SSH test server dependency
        run: python -m pip install paramiko==4.0.0
      - name: Test extracted app, native GUI, sampling and SSH
        run: python -u tools/verify_macos.py --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-validation-${{ matrix.rid }}
          path: |
            artifacts/runtime/*.png
            artifacts/runtime/*.json
            artifacts/runtime/*.log
            dist/packages/macOS/*.zip
            dist/packages/macOS/*.sha256
          retention-days: 30
